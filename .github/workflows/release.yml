name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No dependency cache in the publishing job, so a poisoned cache cannot reach a release.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          echo "VSIX=team-sync-${version}.vsix" >> "$GITHUB_ENV"

      - run: npm run build
      - run: npm test
      - run: npx vsce package --no-dependencies --out "$VSIX"

      - name: Publish to the Visual Studio Marketplace
        run: npx vsce publish --packagePath "$VSIX" --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: npx --yes ovsx@1.3.0 publish "$VSIX" --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Attach the VSIX to a GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$VSIX" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$VSIX" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
