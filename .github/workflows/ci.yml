name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Integration tests in VS Code 1.90 and stable
        run: |
          xvfb-run -a npm run test:integration
          VSCODE_VERSION=stable xvfb-run -a npm run test:integration
      - name: Check that team/team-config.json is up to date
        run: npm run team-config -- --check
      - run: npx vsce package --no-dependencies
